# Nothing personal, ever (floor rule 11). Fails a pull request whose files, commits, title, description or branch name
# hold a term from the PERSONAL_TERMS secret: one term per line, the blanks around it and a Windows line end not part of
# it, set by the owner in the repository's Actions secrets and never written into the repository, since the list itself
# would be personal. Of each commit it reads the message, the author's and the committer's name and address (save those
# of a commit GitHub itself made, which floor rule 11 excepts: a merge, "update branch", an edit or a suggestion
# committed on github.com, under a profile GitHub wrote as the author of a merge it made on the base's side, since one
# made through GitHub's API takes whatever author its caller names; each GitHub commits and signs with its own key,
# which the check fetches from GitHub as it runs; where it cannot, none is excepted, and the run says so), the lines it
# adds (a merge's, those its own resolution adds) and the names of the files it writes, so a term that one commit adds
# and a later one takes out still fails: merging keeps every commit (core archive 201). The commits read are the pull
# request's own, its base's left out, whatever date a commit bears: a date is whatever its maker writes, and a commit
# not yet on main can still be changed. A term in a commit's author or committer most often comes from git's own name on
# the machine that committed, which git writes into every commit made there, the agents' too: its failure says how the
# session that made them mends it in the pull request itself (git's name in the repository set to the login, the pull
# request's commits rewritten), so it holds a project once, never for good (core archive 202; README.md, "Setting up
# (the owner's part)"). A file whose older name holds a term is deleted or renamed away freely; a commit that only edits
# it fails, since the diff names it. It reads no file whose content is binary (a NUL byte, as git tells it:
# `git grep -I`, a diff's "Binary files differ"), pictures included, whatever a .gitattributes says, which the check
# never reads. It prints only where a term was found (file and line, a file whose name holds a term by its line alone,
# or the commit), never the term. Of all it reads, it leaves unread only the random id of a link to a Claude Code
# session (https://claude.ai/code/session_01 and 22 characters of base58, a whole link, a blank, the line's end or a
# mark of punctuation after it), which a
# tool writes at the end of every builder's commit message and description: such a run of characters holds a short term
# by chance and is no one's personal information, while the rest of the link and of its line is read (#261). Each failure says how the session takes the term out, one the project held before the
# check read it too: of what a project held before a check read more, a listed term alone fails rather than being
# reported (core archive 207). Without the secret (a fork, Dependabot, a project that has not set it) it passes with a
# note: the check is optional. It checks this repository, and every project that takes the core calls it
# (workflow_call), pinned to a full commit SHA (README.md, point 5), passing only that secret: the caller's event,
# checkout and token are the caller's own.
name: Personal terms

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  workflow_call:
    secrets:
      PERSONAL_TERMS:
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: personal-terms-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Look for personal terms
        env:
          TERMS: ${{ secrets.PERSONAL_TERMS }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$TERMS" ]; then echo "::notice::PERSONAL_TERMS is not set here, so nothing was checked."; exit 0; fi
          umask 077
          list="$RUNNER_TEMP/terms"
          # (each term without the blanks around it, a carriage return among them, and no empty one)
          printf '%s\n' "$TERMS" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' > "$list"
          found=0
          # (a Claude Code session's id, of its one shape alone, taken out of what is read: a whole link, starting a
          # line or after a blank or an opening mark, so none inside another address; one of any other length,
          # characters or host stays; each taken out in turn, so that links side by side are each found; LC_ALL=C, so
          # that each range is of those letters and digits alone, in any locale)
          unlinked() { LC_ALL=C sed -E -e ':a' -e 's#(^|[[:space:](<["`])(https://claude\.ai/code/session_01)[1-9A-HJ-NP-Za-km-z]{22}([[:space:].,;:!?)>"`/*]|$)#\1\2\3#' -e 'ta'; }
          # (git with no attributes at all, read from the empty tree, so a .gitattributes of the pull request's own
          # cannot have a file of text taken for binary and left unread; git older than 2.40 fails the check)
          empty=$(git hash-object -t tree /dev/null); g() { git --attr-source="$empty" "$@"; }
          rc=0; g -c core.quotePath=false grep -I -z -n -i -F -f "$list" -- . > "$RUNNER_TEMP/hits" || rc=$?
          if [ "$rc" -gt 1 ]; then echo "git could not read the files (it needs git 2.40 or later)"; found=1; fi
          # (each hit as git gives it: the file's name and the line's number each ended by a NUL, the line by a newline;
          # one is dropped only where grep finds a term in the line and none once a session's id is out, so a hit grep
          # would not make alone, as in a case it folds otherwise than git, still fails; what is printed is held to the
          # list first: a file whose name holds a term is named by its line alone, a line number of digits or none, and a
          # name's control characters and a colon it starts with shown as "?", so that no name is read as a command)
          hits=$(while IFS= read -r -d '' name && IFS= read -r -d '' line && IFS= read -r text; do
            if printf '%s\n' "$text" | grep -q -i -F -f "$list" && ! printf '%s\n' "$text" | unlinked | grep -q -i -F -f "$list"; then continue; fi
            if printf '%s\n' "$name" | grep -q -i -F -f "$list"; then name='(a file whose name holds a term)'; fi
            name=${name//[[:cntrl:]]/?}; case $name in :*) name="?${name#:}" ;; esac
            case $line in '' | *[!0-9]*) line='?' ;; esac; printf '%s:%s\n' "$name" "$line"
          done < "$RUNNER_TEMP/hits")
          if [ -n "$hits" ]; then
            echo "A personal term is in these files (file:line), held before this pull request or added by it:"
            printf '%s\n' "$hits"
            echo "To take it out: in this pull request, edit each of those lines, and rename or delete a file whose name holds the term; the check reads the files as they would merge, what main already held included."
            found=1
          fi
          if [ -n "$BASE" ]; then
            # One commit at a time, so every new commit is checked, not only the newest; a failing rev-list fails the
            # job. The checkout is GitHub's merge of the pull request into its base: what its first parent holds is the
            # base's, whatever commit the event names as the base, so it is left out, and with it every commit main
            # already holds, which cannot be changed without rewriting history; none is left out by its date. That
            # merge itself is left out too: GitHub makes it only to check the pull request, under the opener's profile,
            # adds nothing of its own, never reaches main, and no mend could change it.
            side=$BASE head=HEAD; if git rev-parse -q --verify 'HEAD^2' > /dev/null; then side=HEAD^1 head=HEAD^2; fi
            commits=$(git rev-list "$BASE..$head" "^$side")
            bad="" people="" added="" names=""
            # (GitHub's own signing key, from GitHub itself, in a keyring of this run's alone: a merge counts as GitHub's
            # only where its committer is GitHub and an OpenPGP signature on it is good by a key of that keyring, named
            # by its fingerprint; git's other signature formats, which may carry their own certificate, are read by no
            # program, so one written by hand to look so does not)
            keys="$RUNNER_TEMP/github-keys"; mkdir -p -m 700 "$keys"
            if ! curl -fsS --max-time 30 --retry 3 https://github.com/web-flow.gpg | GNUPGHOME="$keys" gpg -q --batch --import 2> /dev/null; then
              echo "::notice::GitHub's signing key could not be fetched, so no commit is taken for one GitHub made: re-run the check"
            fi
            github=$(GNUPGHOME="$keys" gpg --batch --with-colons --list-keys 2> /dev/null \
              | awk -F: '$1 == "pub" { p = 1; next } p && $1 == "fpr" { print $10; p = 0 }')
            # (a commit GitHub itself made: committed as GitHub, an OpenPGP signature on it good by a key of GitHub's, by
            # its fingerprint)
            made() {
              local sig
              [ "$(git log -1 --format='%cn <%ce>' "$1")" = "GitHub <noreply@github.com>" ] && [ -n "$github" ] \
                && sig=$(GNUPGHOME="$keys" git -c gpg.program=gpg -c gpg.x509.program=false -c gpg.ssh.program=false \
                         log -1 --format='%G? %GP' "$1" 2> /dev/null) \
                && printf '%s\n' "$github" | sed 's/^/G /; p; s/^G /U /' | grep -q -x -F -e "$sig"
            }
            # (the profiles GitHub writes as the author of what it made on the base's side, each pull request's merge or
            # squash into main: a commit it made on the pull request's side, a merge or an edit on github.com, passes
            # only under one of them, since one made through GitHub's API takes whatever author its caller names)
            profiles=$(for m in $(git rev-list --max-count=100 --committer='noreply@github.com' "$side"); do
              made "$m" && git log -1 --format='%an <%ae>' "$m"; done | sort -u)
            # (no step here names a shell, so GitHub runs it without pipefail: a grep -q that stops early never makes a
            # hit read as a miss)
            for c in $commits; do
              short=$(git rev-parse --short "$c")
              if git log -1 --format=%B "$c" | unlinked | tr '\n' ' ' | grep -q -i -F -f "$list"; then bad="$bad $short"; fi
              # (save a commit GitHub itself made under a profile above, the acting account's, as floor rule 11 excepts:
              # a merge, "update branch" too, or an edit on github.com)
              if git log -1 --format='%an%n%ae%n%cn%n%ce' "$c" | grep -q -i -F -f "$list" \
                && ! { made "$c" && printf '%s\n' "$profiles" | grep -q -x -F -e "$(git log -1 --format='%an <%ae>' "$c")"; }; then
                people="$people $short"
              fi
              # (the lines it adds, a merge's those its own resolution adds; an octopus merge, which git's remerge-diff
              # skips, those in none of its parents, as its combined diff marks them; git that cannot show them, older
              # than 2.40, fails the check rather than read nothing)
              parents=$(($(git rev-list --parents -n 1 "$c" | wc -w) - 1))
              if [ "$parents" -gt 2 ]; then how=--cc plus="^[+]{$parents}"; else how=--remerge-diff plus='^[+]'; fi
              if ! patch=$(g show --format= --patch "$how" --no-ext-diff --no-textconv --no-color "$c"); then
                echo "git could not show what $short adds (it needs git 2.40 or later)"; found=1
              # (each line read without its own marks of an added line, and no more of it, so a link can start it)
              elif printf '%s\n' "$patch" | grep -E "$plus" | sed -E "s/$plus//" | unlinked | grep -q -i -F -f "$list"; then added="$added $short"; fi
              # (the names of every file it writes, not of one it deletes, so that an older name is taken out freely, as
              # git holds them: empty, renamed or binary ones too, none quoted; a merge's,
              # those its own resolution writes)
              if git diff-tree --root --no-commit-id -r --cc --name-only --no-renames --diff-filter=d -z "$c" | tr '\0' '\n' | grep -q -i -F -f "$list"; then names="$names $short"; fi
            done
            if [ -n "$bad" ]; then echo "A personal term is in these commits' messages:"; echo "$bad"; found=1; fi
            if [ -n "$people" ]; then
              echo "A personal term is in these commits' author or committer (name or address):"; echo "$people"; found=1
              echo "To mend it, on the machine that made them: set git's name and address in this repository to the account's login and its no-reply address (git config user.name <login>; git config user.email <the no-reply address under Settings, Emails>), rewrite this pull request's commits with them (git rebase --exec 'git commit --amend --no-edit --reset-author' origin/main) and push the branch again (git push --force-with-lease). main is never rewritten."
            fi
            if [ -n "$added" ]; then echo "A personal term is in a line that these commits add:"; echo "$added"; found=1; fi
            if [ -n "$names" ]; then echo "A personal term is in the name of a file that these commits write:"; echo "$names"; found=1; fi
            if [ -n "$bad$added$names" ]; then
              echo "To take it out of those commits, though a later one took it away (merging keeps every commit): rewrite them without it (git rebase -i origin/main, a message reworded, a commit edited) and push the branch again (git push --force-with-lease). main is never rewritten."
            fi
          fi
          if printf '%s\n' "$TITLE" "$BODY" "$BRANCH" | unlinked | grep -q -i -F -f "$list"; then
            echo "A personal term is in the PR's title, description or branch name."; found=1
            echo "To take it out: edit the title or the description; a branch's name is taken out by pushing its work to a branch of another name and opening the pull request from it."
          fi
          rm -rf "$list" "$RUNNER_TEMP/hits" "$RUNNER_TEMP/github-keys"
          exit "$found"
